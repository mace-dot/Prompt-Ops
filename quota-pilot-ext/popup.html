<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Quota Pilot</title>
<style>
:root{--bg:#eef1f4;--panel:#fff;--ink:#18202b;--muted:#5b6676;--line:#d5dbe3;--accent:#d98a0b;--accent-ink:#fff;
  --ok:#1f8a5b;--warn:#c27c00;--crit:#c8372d;--info:#2f6fb5;--chip-ok:#e3f4ec;--chip-warn:#fdf1d8;--chip-crit:#fbe4e2;--chip-info:#e3edf9;--track:#e4e8ee}
@media (prefers-color-scheme:dark){:root{--bg:#11161d;--panel:#19212b;--ink:#e6ebf1;--muted:#97a3b3;--line:#2c3743;--accent:#f2a531;--accent-ink:#1a1206;
  --ok:#4cc38a;--warn:#f2b441;--crit:#f0695d;--info:#6fa8e8;--chip-ok:#16352a;--chip-warn:#3a2d10;--chip-crit:#3d1c19;--chip-info:#17293e;--track:#26313d;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;width:370px;background:var(--bg);color:var(--ink);font:13px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;padding:14px;display:grid;gap:12px}
h1{font-size:15px;margin:0;display:flex;align-items:center;gap:8px}
h1 img{width:20px;height:20px}
.label{font:600 10px/1 ui-monospace,Menlo,monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.mono{font-family:ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
.card{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:10px 12px;display:grid;gap:8px}
.head{display:flex;justify-content:space-between;align-items:center}
.pill{font:600 10px/1 ui-monospace,Menlo,monospace;padding:4px 7px;border-radius:99px}
.pill.ok{background:var(--chip-ok);color:var(--ok)}.pill.warn{background:var(--chip-warn);color:var(--warn)}
.pill.crit{background:var(--chip-crit);color:var(--crit)}.pill.info{background:var(--chip-info);color:var(--info)}
.bar{height:7px;background:var(--track);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.adv{color:var(--muted);margin:0}
button{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 9px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
input,select,textarea{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:4px 6px;min-width:0}
textarea{width:100%;font:12px/1.45 ui-monospace,Menlo,monospace;resize:vertical}
details summary{cursor:pointer;color:var(--muted);font-size:12px}
.cfg{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:6px}
.cfg label{display:grid;gap:2px;font-size:11px;color:var(--muted)}
ul{margin:4px 0 0;padding-left:16px;display:grid;gap:3px}
.foot{color:var(--muted);font-size:11px}
</style>
</head>
<body>
  <h1><img src="icons/icon48.png" alt="">Quota Pilot</h1>
  <div id="sites"></div>
  <div class="card">
    <div class="head"><b>Trim a prompt</b><span class="mono" id="tc">0 → 0 tok</span></div>
    <textarea id="in" rows="4" placeholder="Paste a prompt to trim it"></textarea>
    <textarea id="out" rows="3" readonly></textarea>
    <ul id="tips"></ul>
    <div class="row"><button class="primary" id="copy">Copy trimmed</button><span id="msg" class="adv"></span></div>
  </div>
  <p class="foot">On ChatGPT, Claude and Gemini, open the Preview pill (or Alt+T) — your original text stays put until you Apply or Send compressed. Caps are examples; set yours under each assistant.</p>
  <script src="trim.js"></script>
  <script src="quota.js"></script>
  <script src="popup.js"></script>
</body>
</html>
